# Independent mainnet project. No testnet volumes, ports, RPC, or signing mounts.
name: lincoln-mainnet
x-mainnet-runtime: &runtime
  image: ${LINCOLN_MAINNET_IMAGE:?Set an inspected immutable mainnet image ID or digest}
  init: true
  user: "10001:10001"
  restart: "no"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  mem_limit: 2g
  cpus: 1.0
  stop_grace_period: 180s
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777"]
  environment:
    NODE_OPTIONS: --max-old-space-size=1024
    LINCOLN_MAINNET_SIGNING_ENABLED: "0"
  volumes:
    - {type: bind, source: "${LINCOLN_MAINNET_PUBLIC_RELEASE:?Set the staged public production release}/config", target: /app/config, read_only: true, bind: {create_host_path: false}}
    - {type: bind, source: "${LINCOLN_MAINNET_PUBLIC_RELEASE}/artifacts", target: /app/artifacts, read_only: true, bind: {create_host_path: false}}
    - {type: bind, source: "${LINCOLN_MAINNET_PUBLIC_RELEASE}/protocol", target: /app/protocol, read_only: true, bind: {create_host_path: false}}
    - {type: bind, source: "${LINCOLN_MAINNET_PUBLIC_RELEASE}/vendor", target: /app/vendor, read_only: true, bind: {create_host_path: false}}
    - {type: bind, source: "${LINCOLN_MAINNET_CONFIG_DIR:?Set the public mainnet runtime config directory}", target: /run/config/mainnet, read_only: true, bind: {create_host_path: false}}
    # Never use a per-container/anonymous signer volume: all pools + ASP need one address ledger.
    - {type: bind, source: "${LINCOLN_MAINNET_STATE_DIR:?Set a NEW dedicated mainnet state directory}", target: /app/.phase1-private/phase2-mainnet, read_only: false, bind: {create_host_path: false}}
  networks: [mainnet]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  api:
    <<: *runtime
    command: ["node", "/app/docker/mainnet/start.mjs", "api", "${LINCOLN_MAINNET_POOL_ID:-eth}"]
    ports: ["127.0.0.1:${LINCOLN_MAINNET_API_PORT:-19897}:8797"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8797/livez',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10m
      retries: 3
  asp:
    <<: *runtime
    command: ["node", "/app/docker/mainnet/start.mjs", "asp"]
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');const h=JSON.parse(fs.readFileSync('/app/.phase1-private/phase2-mainnet/asp/public/publisher-heartbeat.json'));process.exit(h.chainId===4663&&Date.now()-Date.parse(h.checkedAt)>=0&&Date.now()-Date.parse(h.checkedAt)<30000?0:1)"]
      interval: 15s
      timeout: 5s
      start_period: 10m
      retries: 3
networks:
  mainnet:
    name: lincoln-mainnet-runtime
